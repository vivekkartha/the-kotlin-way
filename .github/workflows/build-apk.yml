name: SMS API Lab APK

on:
  push:
    branches:
      - android-sms-playground
    paths-ignore:
      - SMS-API-Lab.apk
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sms-api-lab-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Commit APK to repository root
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SMS-API-Lab.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f SMS-API-Lab.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update SMS API Lab APK [skip ci]"
            git push origin HEAD:android-sms-playground
          else
            echo "APK unchanged"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sms-api-lab-debug-apk
          path: SMS-API-Lab.apk
          if-no-files-found: error
          retention-days: 7
